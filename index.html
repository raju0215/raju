<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Stream</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eaf3ef;
    }

    .container {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      align-items: center;
    }

    .card {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
      background: #000;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .cta {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 18px 36px;
      background: #2ecc71;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: #27ae60;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
<a href="https://example.com">Watch Now</a>
  <div class="container">
    <div href="https://www.effectivegatecpm.com/cij39zaajr?key=7e5f69ba624c9ac42465230e3272d7cc" class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThZ00WwWEJ4q-5h80Ky7RiPD-LgodJlCfK0A&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgPEI7Em6aYw672UqF1fJFGXlY-AcS4afhEg&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhhDAbtcZPHpjOEPnX6wdgSjF2c85yTSCs_Q&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJTqqlt1XRuf7EP8H8Jku-6jd_-psGn8UGbA&s" /></div>

    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDLsFLJQJC-yb4KQsXX9h0dw6iECjI6IfVxw&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVqSDP1duOr5cJXJXnAq2-maPCmQOP1zO-0w&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRj0nrdDOFFDsq1sY32LXx8gUNfYN7Tb50LpA&s" /></div>
    <div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTn-McqP1fFHqJI4u-DVSMcqKIK-H5txrXboA&s" /></div>

    <div class="cta">
      <button href="https://www.effectivegatecpm.com/cij39zaajr?key=7e5f69ba624c9ac42465230e3272d7cc" class="btn">Watch Now</button>
    </div>
  </div>

</body>
</html>
